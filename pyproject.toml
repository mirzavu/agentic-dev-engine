[project]
name = "openhands-autodev-prototype"
version = "0.1.0"
description = "A deliberately small, verified OpenHands autonomous-development prototype"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openhands-sdk==1.43.1",
  "openhands-tools==1.43.1",
  "openhands-workspace==1.43.1",
  "openhands-agent-server==1.43.1",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodev"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
